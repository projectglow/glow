name: Publish to Maven Central
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Git tag for release"
        required: true
      spark-version:
        description: "Spark version to build against. Use 3.5.1 for Spark 3 release, 4.1.0 for Spark 4 release."
        default: "3.5.1"
      scala-version:
        description: "Scala version. Use 2.12.19 for Spark 3, 2.13.15 for Spark 4."
        default: "2.12.19"
      java-version:
        description: "Java version. Use 8 for Spark 3, 17 for Spark 4."
        default: "8"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Staging
    env:
      SPARK_VERSION: ${{ inputs.spark-version }}
      SCALA_VERSION: ${{ inputs.scala-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release-tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: ${{ inputs.java-version }}

      - name: Install sbt
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          echo "deb https://repo.scala-sbt.org/scalasbt/debian /" | sudo tee /etc/apt/sources.list.d/sbt_old.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y sbt

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish GPG public key to keyserver
        # Maven Central validates artifact signatures against public keyservers, so the
        # signing key's public half must be discoverable there. --send-keys publishes only
        # the public key (no passphrase needed); it is idempotent, so safe to run each release.
        run: |
          KEYID=$(gpg --list-secret-keys --keyid-format=long --with-colons | awk -F: '/^sec:/{print $5; exit}')
          echo "Publishing public key $KEYID to keyservers"
          gpg --keyserver keyserver.ubuntu.com --send-keys "$KEYID"
          gpg --keyserver keys.openpgp.org --send-keys "$KEYID" || true

      - name: Set Sonatype credentials
        run: |
          cat <<EOF >>sonatype.sbt

          credentials += Credentials("Sonatype Nexus Repository Manager",
              "central.sonatype.com",
              "${{ secrets.SONATYPE_USERNAME }}",
              "${{ secrets.SONATYPE_PASSWORD }}")
          EOF

      - name: Check for snapshot dependencies
        # Unit tests already run in CI (tests.yml) against this commit; here we only run the
        # release-specific check that no SNAPSHOT dependencies leak into a release.
        run: sbt clean core/checkNoSnapshotDependencies exit

      - name: Publish Scala artifacts to Maven Central
        run: sbt publishSigned sonatypeCentralRelease exit

      - name: Test staged artifact
        run: sbt stagedRelease/test exit

      - name: Build assembly jar
        run: sbt core/assembly

      - name: Upload assembly jar
        uses: actions/upload-artifact@v4
        with:
          name: assembly-jar
          path: core/target/**/glow*assembly*.jar
