name: Push to production repositories
on:
    workflow_dispatch:
      inputs:
        release-tag:
            description: "Git tag for release"
            required: true
        spark-version:
            description: "Spark version (3.5.1 for Spark 3 release, 4.1.0 for Spark 4 release)"
            default: "3.5.1"
        push-python:
            description: "If true, Python artifacts will be pushed to PyPI"
            type: boolean
            default: true

jobs:
    push-python:
        runs-on: ubuntu-latest
        environment: Production
        permissions:
          id-token: write # Necessary to fetch a token for PyPI publishing
        defaults:
          run:
            shell: bash -el {0}
        env:
            SPARK_VERSION: ${{ inputs.spark-version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                ref: refs/tags/${{ inputs.release-tag }}

            - name: Install Conda
              uses: conda-incubator/setup-miniconda@v3
              with:
                conda-solver: libmamba
                environment-file: python/environment.yml
                activate-environment: glow

            - name: Build whl and sdist
              run: (cd python && python setup.py bdist_wheel sdist)

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              if: ${{ inputs.push-python }}
              with:
                packages-dir: python/dist/
                verbose: true
